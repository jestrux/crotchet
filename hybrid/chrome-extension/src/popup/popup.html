<!doctype html>
<html>
  <head>

    <title>Crotchet</title>
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <div id="app">
      <h1>Crotchet</h1>

    </div>
    <script src="./popup.js"></script>
  </body>
</html>
